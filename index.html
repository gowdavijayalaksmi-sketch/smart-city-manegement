<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Job Match — Live Demo</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c1f24;--sub:#5b6270;--line:#e3e6ea;--accent:#2f5d50;--accent-ink:#fff;--warn:#b3541e;--warn-bg:#fdf1e6;--ok:#1f7a4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1e2126;--ink:#eceef0;--sub:#9aa1ac;--line:#33373e;--accent:#5fae97;--accent-ink:#0e1210;--warn:#e8935a;--warn-bg:#3a2a1c;--ok:#63c793}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1e2126;--ink:#eceef0;--sub:#9aa1ac;--line:#33373e;--accent:#5fae97;--accent-ink:#0e1210;--warn:#e8935a;--warn-bg:#3a2a1c;--ok:#63c793}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:840px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.3rem;margin:6px 0 2px}
.sub{color:var(--sub);font-size:.9rem;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 10px}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:4px 0 10px}
textarea{min-height:90px}
label{font-size:.82rem;color:var(--sub);display:block;margin-top:6px}
button{font:inherit;font-weight:600;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.small{padding:5px 10px;font-size:.8rem}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.muted{color:var(--sub);font-size:.85rem}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.76rem;margin:2px 4px 2px 0}
.tag-verified{background:#e5f4ec;color:var(--ok)}
.tag-flagged{background:var(--warn-bg);color:var(--warn)}
.tag-missing{background:#eee;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Smart Job Match — Live Demo</h1>
  <div class="sub">Raw text → AI extraction → skills verification → job matching → human review. No skill is ever priced/assumed without a match in the taxonomy.</div>

  <div class="card">
    <h2>1. Paste a resume or message</h2>
    <textarea id="rawText" placeholder="Hi, I'm Priya. 3 years backend dev with Python and Django, also know AWS and basic Docker. Looking for remote roles. priya@example.com"></textarea>
    <button id="extractBtn" onclick="extractProfile()">Extract profile with AI</button>
    <span id="extractStatus" class="muted"></span>
  </div>

  <div class="card hidden" id="reviewCard">
    <h2>2. Review & verify</h2>
    <div class="row">
      <div><label>Name</label><input id="fName"></div>
      <div><label>Email</label><input id="fEmail"></div>
      <div><label>Experience (yrs)</label><input id="fExp" type="number"></div>
      <div><label>Role focus</label><input id="fRole"></div>
    </div>
    <label>Skills (comma separated) — checked against the taxonomy below</label>
    <input id="fSkills">
    <button class="small secondary" onclick="verifyAndRender()">Re-check skills</button>
    <div id="skillList" style="margin-top:8px"></div>
    <div style="margin-top:14px"><button onclick="runMatch()">Approve & find matches</button></div>
  </div>

  <div class="card hidden" id="resultsCard">
    <h2>3. Ranked matches</h2>
    <div id="summaryBox" class="muted"></div>
    <table><thead><tr><th>Job</th><th>Location</th><th>Score</th><th>Skill breakdown</th></tr></thead><tbody id="resultsBody"></tbody></table>
    <button class="secondary" onclick="location.reload()" style="margin-top:12px">Start over</button>
  </div>
</div>

<script>
// ---- trusted source data (mirrors data/skills_taxonomy.json and data/jobs.json in the repo) ----
const TAXONOMY = [
  {canonical:"Python",aliases:["python","py"]},{canonical:"Django",aliases:["django"]},
  {canonical:"Flask",aliases:["flask"]},{canonical:"Amazon Web Services",aliases:["aws","amazon web services"]},
  {canonical:"Docker",aliases:["docker"]},{canonical:"Kubernetes",aliases:["kubernetes","k8s"]},
  {canonical:"JavaScript",aliases:["javascript","js","es6"]},{canonical:"React",aliases:["react","reactjs","react.js"]},
  {canonical:"Node.js",aliases:["node","node.js","nodejs"]},{canonical:"SQL",aliases:["sql","mysql","postgresql","postgres"]},
  {canonical:"Project Management",aliases:["project management","pm","agile","scrum"]},{canonical:"Java",aliases:["java"]},
  {canonical:"Excel",aliases:["excel","ms excel","microsoft excel"]},{canonical:"Communication",aliases:["communication","communication skills"]}
];
const JOBS = [
  {id:1,title:"Backend Engineer (Remote)",required_skills:["Python","Django","Amazon Web Services"],location:"Remote",remote:true},
  {id:2,title:"Full Stack Developer",required_skills:["JavaScript","React","Node.js","SQL"],location:"Bangalore",remote:false},
  {id:3,title:"DevOps Engineer",required_skills:["Docker","Kubernetes","Amazon Web Services"],location:"Remote",remote:true},
  {id:4,title:"Frontend Developer",required_skills:["JavaScript","React"],location:"Remote",remote:true},
  {id:5,title:"Project Manager - Tech",required_skills:["Project Management","SQL","Communication"],location:"Mumbai",remote:false},
  {id:6,title:"Java Backend Developer",required_skills:["Java","SQL"],location:"Pune",remote:false},
  {id:7,title:"Data Analyst",required_skills:["SQL","Excel","Python"],location:"Remote",remote:true}
];
const aliasMap = {};
TAXONOMY.forEach(e=>{ e.aliases.forEach(a=>aliasMap[a.toLowerCase()]=e.canonical); aliasMap[e.canonical.toLowerCase()]=e.canonical; });

function verifySkills(raw){
  return raw.map(r=>{
    const key=r.toLowerCase().trim();
    if(aliasMap[key]) return {input:r, canonical:aliasMap[key], verified:true};
    for(const alias in aliasMap){
      if(key.includes(alias)||alias.includes(key)) return {input:r, canonical:aliasMap[alias], verified:false, note:"fuzzy match only"};
    }
    return {input:r, canonical:r, verified:false, note:"not in taxonomy"};
  });
}
function matchJobs(verified){
  const set={}; verified.forEach(v=>set[v.canonical.toLowerCase()]=v.verified);
  return JOBS.map(job=>{
    const details=job.required_skills.map(req=>{
      const key=req.toLowerCase();
      if(!(key in set)) return {skill:req,status:"missing",weight:0};
      return {skill:req,status:set[key]?"verified":"flagged",weight:set[key]?1:0.5};
    });
    const total=details.reduce((s,d)=>s+d.weight,0);
    const score=Math.round((total/job.required_skills.length)*100);
    return {...job, score, skillBreakdown:details};
  }).sort((a,b)=>b.score-a.score);
}

let sample=null, lastVerified=[];

async function extractProfile(){
  const text=document.getElementById('rawText').value.trim();
  if(!text) return;
  document.getElementById('extractBtn').disabled=true;
  document.getElementById('extractStatus').textContent='Contacting AI…';
  try{
    if(!sample) sample = await claude.use('sample');
    if(!sample){ document.getElementById('extractStatus').textContent='AI extraction unavailable in this view.'; document.getElementById('extractBtn').disabled=false; return; }
    const prompt = `Extract structured profile data from this job seeker's raw text. Return ONLY minified JSON, no markdown:
{"name":"","email":"","experience_years":null,"role_focus":"","skills":[]}
Rules: never invent skills, years, or facts not stated or clearly implied. Missing fields: "" or null.
Text: """${text}"""`;
    const profile = await sample.json(prompt, {modelTier:'quick'});
    fillReview(profile);
    document.getElementById('extractStatus').textContent='Done — review below.';
  }catch(e){
    document.getElementById('extractStatus').textContent='Extraction failed: '+(e.message||e.code||'error');
    fillReview({name:'',email:'',experience_years:null,role_focus:'',skills:[]});
  }
  document.getElementById('extractBtn').disabled=false;
}

function fillReview(p){
  document.getElementById('reviewCard').classList.remove('hidden');
  document.getElementById('fName').value=p.name||'';
  document.getElementById('fEmail').value=p.email||'';
  document.getElementById('fExp').value=p.experience_years??'';
  document.getElementById('fRole').value=p.role_focus||'';
  document.getElementById('fSkills').value=(p.skills||[]).join(', ');
  verifyAndRender();
  document.getElementById('reviewCard').scrollIntoView({behavior:'smooth'});
}

function verifyAndRender(){
  const skills=document.getElementById('fSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
  lastVerified=verifySkills(skills);
  document.getElementById('skillList').innerHTML = lastVerified.map(s=>{
    const cls=s.verified?'tag-verified':'tag-flagged';
    const label=s.verified? s.canonical+' ✓' : (s.canonical||s.input)+' ⚠ unverified';
    return `<span class="tag ${cls}" title="${s.note||''}">${label}</span>`;
  }).join(' ');
}

function runMatch(){
  const matches=matchJobs(lastVerified);
  document.getElementById('resultsCard').classList.remove('hidden');
  document.getElementById('resultsBody').innerHTML = matches.map(m=>{
    const bd=m.skillBreakdown.map(d=>{
      const cls=d.status==='verified'?'tag-verified':d.status==='flagged'?'tag-flagged':'tag-missing';
      return `<span class="tag ${cls}">${d.skill}: ${d.status}</span>`;
    }).join(' ');
    return `<tr><td>${m.title}</td><td>${m.location}${m.remote?' (remote)':''}</td><td><strong>${m.score}%</strong></td><td>${bd}</td></tr>`;
  }).join('');
  const top=matches[0];
  const flagged=top.skillBreakdown.filter(d=>d.status==='flagged').map(d=>d.skill);
  document.getElementById('summaryBox').textContent = `Top match: ${top.title} — ${top.score}% match.` +
    (flagged.length? ` Note: ${flagged.join(', ')} ${flagged.length>1?'are':'is'} self-reported/unverified — consider a quick skills check before relying on ${flagged.length>1?'them':'it'}.` : '');
  document.getElementById('resultsCard').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
